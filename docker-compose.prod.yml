# Coolify deployment (Docker Compose build pack), one stack per environment.
# Postgres runs as a separate Coolify database resource (backups, restore);
# set the variables below in Coolify. Object storage (deploy/storage) is its own
# resource too. Manifest domains are added to the `web` service in Coolify;
# academies' own domains reach Traefik through its HTTP provider. See docs/deployment.md.
services:
  migrate:
    build: { context: ., target: worker }
    command: ["node", "--import", "tsx", "scripts/migrate.ts"]
    environment:
      DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL:?}
    restart: "no"

  web:
    build: { context: ., target: web }
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      # Seals stored secrets (credential signing keys, webhook secrets); never rotate casually.
      DATA_ENCRYPTION_SECRET: ${DATA_ENCRYPTION_SECRET:?}
      APP_PROTOCOL: https
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:?}
      SMTP_URL: ${SMTP_URL:?}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_REVIEW_MODEL: ${LLM_REVIEW_MODEL:-}
      LLM_BRAND_MODEL: ${LLM_BRAND_MODEL:-}
      LLM_AUTHORING_MODEL: ${LLM_AUTHORING_MODEL:-}
      # Monthly AI allowance per academy (docs/deployment.md §11); unset: no limit.
      AI_MONTHLY_ALLOWANCE_USD: ${AI_MONTHLY_ALLOWANCE_USD:-}
      AI_UNPRICED_CALL_USD: ${AI_UNPRICED_CALL_USD:-}
      # Video storage per academy in GB (docs/deployment.md §11); unset: no limit.
      MEDIA_STORAGE_QUOTA_GB: ${MEDIA_STORAGE_QUOTA_GB:-}
      # Self-serve signup: unset PLATFORM_HOST keeps it off (academies from manifests only).
      PLATFORM_HOST: ${PLATFORM_HOST:-}
      ACADEMY_DOMAIN: ${ACADEMY_DOMAIN:-}
      PLATFORM_TERMS_URL: ${PLATFORM_TERMS_URL:-}
      PLATFORM_DPA_URL: ${PLATFORM_DPA_URL:-}
      PLATFORM_PRIVACY_URL: ${PLATFORM_PRIVACY_URL:-}
      PLATFORM_IMPRINT_URL: ${PLATFORM_IMPRINT_URL:-}
      PLATFORM_DEMO_URL: ${PLATFORM_DEMO_URL:-}
      PLATFORM_AGREEMENT_VERSION: ${PLATFORM_AGREEMENT_VERSION:-}
      # Content reports from the website (DSA), and the operator's notice of new academies.
      PLATFORM_ABUSE_EMAIL: ${PLATFORM_ABUSE_EMAIL:-}
      PLATFORM_NOTIFY_EMAIL: ${PLATFORM_NOTIFY_EMAIL:-}
      # Custom domains (docs/deployment.md): where they point, and the proxy config endpoint.
      CUSTOM_DOMAIN_TARGET: ${CUSTOM_DOMAIN_TARGET:-}
      PROXY_CONFIG_TOKEN: ${PROXY_CONFIG_TOKEN:-}
      PROXY_SERVICE_URL: ${PROXY_SERVICE_URL:-}
      PROXY_HTTP_ENTRYPOINT: ${PROXY_HTTP_ENTRYPOINT:-}
      PROXY_HTTPS_ENTRYPOINT: ${PROXY_HTTPS_ENTRYPOINT:-}
      PROXY_CERT_RESOLVER: ${PROXY_CERT_RESOLVER:-}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      # Cookieless page views and error reports (docs/deployment.md §8).
      ANALYTICS_PROVIDER: ${ANALYTICS_PROVIDER:-}
      ANALYTICS_SCRIPT_URL: ${ANALYTICS_SCRIPT_URL:-}
      ANALYTICS_WEBSITE_ID: ${ANALYTICS_WEBSITE_ID:-}
      ERROR_REPORTING_DSN: ${ERROR_REPORTING_DSN:-}
      APP_RELEASE: ${APP_RELEASE:-}
      APP_ENV: ${APP_ENV:-}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-}
      LOG_FORMAT: ${LOG_FORMAT:-}
      S3_REGION: ${S3_REGION:-}
    expose:
      - "3000"
    restart: unless-stopped

  worker:
    build: { context: ., target: worker }
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?}
      DATA_ENCRYPTION_SECRET: ${DATA_ENCRYPTION_SECRET:?}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:?}
      SMTP_URL: ${SMTP_URL:?}
      # Custom domains are checked by the worker: same target as the web service.
      ACADEMY_DOMAIN: ${ACADEMY_DOMAIN:-}
      PLATFORM_HOST: ${PLATFORM_HOST:-}
      CUSTOM_DOMAIN_TARGET: ${CUSTOM_DOMAIN_TARGET:-}
      # Links in learner mail (review ready, level-up).
      APP_PROTOCOL: https
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_REVIEW_MODEL: ${LLM_REVIEW_MODEL:-}
      LLM_AUTHORING_MODEL: ${LLM_AUTHORING_MODEL:-}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-}
      WHISPER_BASE_URL: ${WHISPER_BASE_URL:-}
      WHISPER_API_KEY: ${WHISPER_API_KEY:-}
      WHISPER_MODEL: ${WHISPER_MODEL:-}
      # Same allowance as the web service: reviews and authoring jobs check it.
      AI_MONTHLY_ALLOWANCE_USD: ${AI_MONTHLY_ALLOWANCE_USD:-}
      AI_UNPRICED_CALL_USD: ${AI_UNPRICED_CALL_USD:-}
      # Same video storage quota as the web service; a mistyped one stops the worker at start.
      MEDIA_STORAGE_QUOTA_GB: ${MEDIA_STORAGE_QUOTA_GB:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-}
      ERROR_REPORTING_DSN: ${ERROR_REPORTING_DSN:-}
      APP_RELEASE: ${APP_RELEASE:-}
      APP_ENV: ${APP_ENV:-}
      # Same zone as the web service: homework reminders state the deadline in it.
      APP_TIME_ZONE: ${APP_TIME_ZONE:-}
      LOG_FORMAT: ${LOG_FORMAT:-}
    restart: unless-stopped
