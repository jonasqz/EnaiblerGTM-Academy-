# Coolify deployment (Docker Compose build pack), one stack per environment.
# Postgres runs as a separate Coolify database resource (backups, restore);
# set the variables below in Coolify. Tenant domains are added to the `web`
# service in Coolify (Traefik + Let's Encrypt). See docs/deployment.md.
services:
  migrate:
    build: { context: ., target: worker }
    command: ["node", "--import", "tsx", "scripts/migrate.ts"]
    environment:
      DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL:?}
    restart: "no"

  web:
    build: { context: ., target: web }
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      APP_PROTOCOL: https
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:?}
      SMTP_URL: ${SMTP_URL:?}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_REVIEW_MODEL: ${LLM_REVIEW_MODEL:-}
      LLM_BRAND_MODEL: ${LLM_BRAND_MODEL:-}
      # Self-serve signup: unset PLATFORM_HOST keeps it off (academies from manifests only).
      PLATFORM_HOST: ${PLATFORM_HOST:-}
      ACADEMY_DOMAIN: ${ACADEMY_DOMAIN:-}
      PLATFORM_TERMS_URL: ${PLATFORM_TERMS_URL:-}
      PLATFORM_DPA_URL: ${PLATFORM_DPA_URL:-}
      PLATFORM_PRIVACY_URL: ${PLATFORM_PRIVACY_URL:-}
      PLATFORM_IMPRINT_URL: ${PLATFORM_IMPRINT_URL:-}
      PLATFORM_AGREEMENT_VERSION: ${PLATFORM_AGREEMENT_VERSION:-}
    expose:
      - "3000"
    restart: unless-stopped

  worker:
    build: { context: ., target: worker }
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:?}
      SMTP_URL: ${SMTP_URL:?}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_REVIEW_MODEL: ${LLM_REVIEW_MODEL:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    restart: unless-stopped
