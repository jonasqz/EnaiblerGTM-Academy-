# Local development services. The app itself runs with `npm run dev`.
#   docker compose up -d
#   npm run db:migrate && npm run tenant:apply -- config/tenants/*.yaml
#   npm run doctor          # checks all of it and says what to fix
#
# The host ports can move when something else on the machine already holds
# them (on many Macs a Postgres from Homebrew or Postgres.app answers on 5432
# and connections reach it instead of the container). Put the port in a file
# named `.env` next to this one, e.g. POSTGRES_PORT=55432, run
# `docker compose up -d` again, and use the same port in DATABASE_URL and
# DATABASE_MIGRATION_URL in .env.local. Also: STORAGE_PORT, MAILPIT_WEB_PORT,
# MAILPIT_SMTP_PORT (S3_ENDPOINT and SMTP_URL follow them).
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
      ENAIBLER_DB: enaibler
      ENAIBLER_OWNER_PASSWORD: owner
      ENAIBLER_APP_PASSWORD: app
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./deploy/postgres/init.sh:/docker-entrypoint-initdb.d/10-enaibler.sh:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  # S3-compatible storage (SeaweedFS) on http://localhost:8333; the app
  # creates the bucket on first use in development.
  storage:
    image: chrislusf/seaweedfs:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /etc/seaweedfs
        echo '{"identities":[{"name":"dev","credentials":[{"accessKey":"enaibler","secretKey":"enaibler-dev-secret"}],"actions":["Admin","Read","List","Tagging","Write"]}]}' > /etc/seaweedfs/s3.json
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -volume.max=0
    ports:
      - "${STORAGE_PORT:-8333}:8333"
    volumes:
      - storage-data:/data

  # Catches outgoing mail: web UI on http://localhost:8025, SMTP on :1025.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_WEB_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

volumes:
  postgres-data:
  storage-data:
